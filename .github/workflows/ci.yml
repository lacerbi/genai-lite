name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, '22.x', '24.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Blocking gate: production dependencies only. These are the only ones
      # consumers of the published package inherit.
      - name: Run npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      # Informational: the full tree, including devDependencies. Non-blocking
      # because dev-only advisories are routinely unfixable from here — they sit
      # behind pinned ranges in the toolchain (e.g. jest pins glob@10, which
      # pulls a brace-expansion flagged by GHSA-mh99-v99m-4gvg). Nothing here
      # ships to consumers, but regressions should still be visible in the log.
      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Validate package
        run: npm pack --dry-run